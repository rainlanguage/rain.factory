[profile.default]
src = 'src'
test = 'test'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

libs = ["dependencies"]

# `script/Build.sol` regenerates `src/generated/`.
fs_permissions = [{ access = "read-write", path = "./src/generated" }]

[fuzz]
runs = 2048

# Library repo: the ICloneable* interface surface plus the Lib* logic that
# implements it. The concrete CloneFactory, its deploy-pin snapshots and deploy
# scripts live in rain.factory.deploy (rainlanguage/rain.factory#46). The
# published src/ imports nothing external, so every dependency here is
# test-harness or build-script only: forge-std, OZ Clones as the independent
# equivalence oracle for the EIP1167 construction, OZ BeaconProxy whose
# creation code `script/Build.sol` pins into `src/generated/`, and
# rain-sol-codegen, which writes that file.
[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.6.1"
rain-sol-codegen = "0.1.39"

[soldeer]
recursive_deps = false
