[profile.default]
src = 'src'
test = 'test'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

libs = ["dependencies"]

# `script/Build.sol` regenerates `src/generated/`.
fs_permissions = [{ access = "read-write", path = "./src/generated" }]

[fuzz]
runs = 2048

[fmt]
line_length = 120

# Library repo: the ICloneable* interface surface, the Lib* logic that
# implements it, and the clone and beacon-proxy deploy mechanisms that extend
# rain-deploy's suites. The concrete CloneFactory, its deploy-pin snapshots and
# deploy scripts live in rain.factory.deploy (rainlanguage/rain.factory#46).
[dependencies]
forge-std = "1.17.0"
# With the [profile.default] compiler settings this fixes the generated
# BeaconProxy creation code and so the ICloneableFactoryV5 address derivation:
# a bump that changes `src/generated/` needs a new interface version.
"@openzeppelin-contracts" = "5.7.0"
rain-sol-codegen = "0.1.39"
rain-deploy = "0.1.27"
rain-metadata = "0.1.43"
safe-global-safe-smart-account = "1.4.1-3"

[soldeer]
recursive_deps = false
