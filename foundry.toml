[profile.default]
src = 'src'
test = 'test'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

libs = ["dependencies"]

# The interface half of this repo is a PUBLISHED ABI: downstream indexers and
# soldeer consumers decode `NewClone` and call `initialize` by NAME, from the
# compiled ABI. Parameter names, parameter order among same-typed parameters,
# `indexed` flags and return types are all invisible to the EVM but visible to
# those consumers, so the only place they can be pinned by a test is the
# compiled artifact. Read-only access to `out` exists for exactly that.
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 2048

# Library repo: the ICloneable* interface surface plus the Lib* logic that
# implements it. The concrete CloneFactory, its deploy-pin snapshots and deploy
# scripts live in rain.factory.deploy (rainlanguage/rain.factory#46). The
# published src/ imports nothing external, so every dependency here is
# test-harness only: forge-std, and OZ Clones as the independent equivalence
# oracle for the EIP1167 construction.
[dependencies]
forge-std = "1.16.1"
"@openzeppelin-contracts" = "5.6.1"

[soldeer]
recursive_deps = false
