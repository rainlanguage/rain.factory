name: Package Release
on:
  push:
    branches:
      - main
jobs:
  release:
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      # Library repo: the ICloneable* interface surface plus the Lib* logic behind
      # it. The deploy half (concrete + deploy-pin snapshots) lives in
      # rain.factory.deploy (rainlanguage/rain.factory#46).
      soldeer-package: rain-factory
    secrets: inherit
